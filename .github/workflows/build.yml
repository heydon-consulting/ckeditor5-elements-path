name: Build

# The compiled plugin is committed (GitHub's release downloads come from the
# repository), so it must match the source.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The committed build matches the source
        run: |
          if ! git diff --exit-code -- build; then
            echo "::error::build/ is out of date: run npm run build and commit it."
            exit 1
          fi
